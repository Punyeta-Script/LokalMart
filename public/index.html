/* ---------- Cart & Checkout ---------- */
function add(id){if(!D.me){closeS();return go('auth')}const p=P(id),q=Math.max(1,+$('#qty').value||1);const c=D.cart.find(x=>x.pid==id),t=(c?c.q:0)+q;
if(t>p.stock)return toast('Only '+p.stock+' in stock');c?c.q=t:D.cart.push({pid:id,q});save();closeS();toast('Added to cart');render()}
function cart(){if(!D.cart.length)return `<div class="empty">${ic('bag')}<h3>Your cart is empty</h3><p class="mu">Browse local products and add them here.</p><button class="b" onclick="go('home')">Start shopping</button></div>`;
const by={};let tot=0,n=0;D.cart.forEach(c=>{const p=P(c.pid);(by[p.sid]=by[p.sid]||[]).push([c,p]);tot+=c.q*pr(p);n+=c.q});
return `<div class="ctop"><div class="cbig">${ic('bag')}<i>${n}</i></div><div><div class="mu">Total:</div><div class="tot">${m(tot)}</div></div></div>`+Object.keys(by).map(sid=>`<div class="mu" style="margin:10px 2px 4px">${ic('store')} ${esc(U(sid).seller.store)}</div>`+by[sid].map(([c,p])=>`<div class="card"><div class="row sp" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap"><div class="em" style="width:54px;height:54px;font-size:26px;margin:0">${em(p)}</div><div><b>${esc(p.name)}</b><div class="mu">${m(pr(p))}/${p.unit}</div></div></div><div class="st"><button onclick="qty(${p.id},-1)">${ic('minus')}</button><input class="qi" type="number" inputmode="numeric" min="0" value="${c.q}" onchange="setQ(${p.id},this.value)"><button onclick="qty(${p.id},1)">${ic('plus')}</button></div></div><div class="pr" style="text-align:right">${m(c.q*pr(p))}</div></div>`).join('')).join('')+`<div class="mu">One order is created per seller at checkout.</div><button class="b nx" onclick="go('checkout')">NEXT ${ic('arrowR')}</button>`}
function qty(id,d){const c=D.cart.find(x=>x.pid==id),p=P(id);c.q+=d;if(c.q>p.stock){c.q=p.stock;toast('Stock limit reached')}if(c.q<1)D.cart=D.cart.filter(x=>x!=c);save();render()}
let CK={method:'delivery',addr:'',note:'',pay:'COD',vc:'',when:'ASAP'};
function checkout(){const u=me();if(!u)return auth();if(!D.cart.length)return cart();const sids=[...new Set(D.cart.map(c=>P(c.pid).sid))];
const sub=D.cart.reduce((a,c)=>a+c.q*pr(P(c.pid)),0),fee=CK.method=='delivery'?40*sids.length:0,dis=Math.min(vd(CK.vc,sub,fee),sub+fee);
return `<div class="row sp" style="margin:4px 0 14px"><b style="font-size:20px">Payment:</b><b class="tot">${m(sub+fee-dis)}</b></div>

${CK.method=='delivery'?`<label>Delivery address</label><select onchange="CK.addr=this.value">${u.addrs.map(a=>`<option ${CK.addr==a?'selected':''}>${esc(a)}</option>`).join('')}</select><select id="nb">${lopt('')}</select><input id="na" placeholder="House no., street / purok"><button class="b ac s" onclick="addAddr()">Save address</button>`:''}
<label>Schedule</label><select onchange="CK.when=this.value">${['ASAP','Today afternoon','Tomorrow morning','Tomorrow afternoon'].map(w=>`<option ${CK.when==w?'selected':''}>${w}</option>`).join('')}</select></div>
<label class="lb">Voucher code (try LOKAL10)</label><input value="${esc(CK.vc)}" onchange="CK.vc=this.value;render()"><div class="mu" style="margin:2px 0 4px">${CK.vc&&!dis?'<span style="color:var(--rd)">Code not valid for this order. </span>':''}<a onclick="go(\'vouch\')" style="text-decoration:underline;cursor:pointer">See vouchers</a></div><label class="lb">Notes for seller</label><textarea oninput="CK.note=this.value">${esc(CK.note)}</textarea>
<div class="card" style="margin-top:10px"><div class="row sp"><span>Subtotal</span><span>${m(sub)}</span></div><div class="row sp"><span>Shipping</span><span>${m(fee)}</span></div>${dis?`<div class="row sp"><span>Voucher</span><span>-${m(dis)}</span></div>`:''}<div class="row sp"><b>Total</b><b class="pr">${m(sub+fee-dis)}</b></div></div><button class="b big" onclick="place()">PLACE ORDER</button>`}
function addAddr(){const v=$('#na').value.trim();if(!v)return toast('Enter street / purok');const a=v+', '+$('#nb').value;me().addrs.push(a);CK.addr=a;save();render()}
function place(){const u=me();if(CK.method=='delivery'&&!(CK.addr||u.addrs[0]))return toast('Add a delivery address');

const rows=Object.keys(by).map(sid=>({sid,sub:by[sid].reduce((a,i)=>a+i.price*i.q,0),fee:CK.method=='delivery'?40:0})),tS=rows.reduce((a,r)=>a+r.sub,0),tF=rows.reduce((a,r)=>a+r.fee,0),tD=Math.min(vd(CK.vc,tS,tF),tS+tF);let left=tD;
rows.forEach((r,k)=>{const sid=r.sid,sub=r.sub,fee=r.fee,d=k==rows.length-1?left:Math.round(tD*(sub+fee)/((tS+tF)||1));left-=d;
D.orders.unshift({id:++D.seq,bid:u.id,sid:+sid,items:by[sid],sub,fee,total:sub+fee-d,disc:d,comm:+(sub*D.commission/100).toFixed(2),method:CK.method,addr:CK.addr||u.addrs[0]||'',note:(CK.when!='ASAP'?'['+CK.when+'] ':'')+CK.note,pay:CK.method=='pickup'?'Cash on Pickup':'COD',paid:0,status:'Pending',date:new Date().toLocaleString(),ts:Date.now(),rated:0});

const hash=s=>{let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return(h>>>0).toString(36)};
function login(){const u=D.users.find(x=>x.email==$('#e').value.trim()&&(x.pw==$('#p').value));if(!u)return toast('Invalid credentials');if(!u.active)return toast('Account deactivated');u.hist.unshift(new Date().toLocaleString());D.me=u.id;save();toast('Welcome '+u.name);go('home')}
function reg(){const e=$('#e').value.trim(),n=$('#n').value.trim(),p=$('#p').value;if(!n||!e||p.length<6)return toast('Fill all fields (password ≥ 6)');if(D.users.some(u=>u.email==e))return toast('Already registered');
const u={id:Date.now()%1e9,name:n,email:e,pw:p,role:'user',active:1,addrs:[],hist:[]};if($('#sl').checked)u.seller={store:$('#st').value||n+"'s Store",desc:'',area:$('#ar').value||LOCS[0],open:1,status:'pending',plan:'Free',ratings:[]};
D.users.push(u);notify(1,'New '+(u.seller?'seller application':'user')+': '+n);D.me=u.id;save();toast('Verification code sent (demo)');go('me')}
function forgot(){const e=prompt('Enter your email/mobile');const u=D.users.find(x=>x.email==e);if(!u)return toast('Not found');const p=prompt('Enter new password (min 6) — demo reset');if(p&&p.length>=6){u.pw=p;save();toast('Password reset')}}
function prof(){const u=me();if(!u)return auth();const s=u.seller,nt=D.notes.filter(n=>n.uid==u.id);
return `<div class="card"><h3>${ic('user')} ${u.name}</h3><div class="mu">${u.email} · ${u.role=='admin'?'Admin':s?'Buyer & Seller':'Buyer'}</div></div>
<div class="row"><button class="b o" onclick="go('fav')">${ic('heartf')} Favorites</button>${s?`<button class="b" onclick="go('seller')">${ic('store')} Seller Dashboard</button>`:`<button class="b o" onclick="applySeller()">Become a seller</button>`}${u.role=='admin'?`<button class="b" onclick="go('admin')">${ic('tools')} Admin</button>`:''}</div>
<div class="card" style="margin-top:10px"><b>Edit profile</b><input id="pn" value="${u.name}"><input id="pa" placeholder="Add delivery address"><div class="mu">${u.addrs.map(a=>ic('pin')+' '+a).join('<br>')}</div><input id="pw" type="password" placeholder="New password (optional)"><button class="b s" onclick="saveProf()">Save</button></div>
<div class="row"><button class="b o" onclick="logout()">Logout</button><button class="b r" onclick="deact()">Deactivate account</button></div>`}
function saveProf(){const u=me();u.name=$('#pn').value||u.name;if($('#pa').value)u.addrs.push($('#pa').value);if($('#pw').value.length>=6)u.pw=$('#pw').value;save();toast('Saved');render()}
function deact(){if(confirm('Deactivate your account?')){me().active=0;D.me=null;save();go('auth')}}
function applySeller(){if(!D.me)return go('auth');openS(`<h3>Become a seller</h3><input id="as" placeholder="Store name"><select id="aa">${lopt('')}</select><button class="b" style="width:100%" onclick="doApply()">Submit application</button>`)}
function doApply(){const s=$('#as').value.trim();if(!s)return toast('Enter a store name');me().seller={store:s,desc:'',area:$('#aa').value,open:1,status:'pending',plan:'Free',ratings:[]};notify(1,'Seller application: '+s);save();closeS();toast('Application submitted');render()}
/* ---------- Seller ---------- */
function sell(){const u=me();if(!u||!u.seller)return auth();const s=u.seller;if(s.status!='approved')return `<div class="card"><h3>Application ${s.status}</h3>Admin verification is required before you can sell.</div>`;
const T=TAB||'sum',os=D.orders.filter(o=>o.sid==u.id),done=os.filter(o=>o.status=='Completed'),sales=done.reduce((a,o)=>a+o.sub,0),cm=done.reduce((a,o)=>a+o.comm,0),mine=D.products.filter(p=>p.sid==u.id);
const tabs=`<div class="tabs">${[['sum','Dashboard'],['prod','Products'],['ord','Orders'],['store','Store']].map(t=>`<span class="chip ${T==t[0]?'on':''}" onclick="go('seller','${t[0]}')">${t[1]}</span>`).join('')}</div>`;
if(T=='sum'){const best=[...mine].sort((a,b)=>b.sold-a.sold).slice(0,3);const dy=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5),v=os.filter(o=>o.ts&&new Date(o.ts).toDateString()==d.toDateString()&&!/Rej|Canc/.test(o.status)).reduce((a,o)=>a+o.sub,0);return[d.toLocaleDateString('en',{weekday:'short'}),v]}),mx=Math.max(1,...dy.map(x=>x[1])),ch=dy.map(x=>`<div><i style="height:${x[1]/mx*80}px"></i>${x[0]}</div>`).join('');
return tabs+`<div class="stat"><div><b>${m(sales)}</b>Total sales</div><div><b>${os.length}</b>Total orders</div><div><b>${m(cm)}</b>Est. commission (${D.commission}%)</div><div><b>${m(sales-cm)}</b>Net proceeds</div></div><div class="card"><b>Sales · last 7 days</b><div class="chart">${ch}</div></div><div class="card"><b>Best sellers</b>${best.map(p=>`<div class="row sp"><span>${p.name}</span><span class="mu">${p.sold} sold</span></div>`).join('')}</div><div class="card"><b>${ic('warn')} Low stock</b>${mine.filter(p=>p.stock<5).map(p=>`<div>${p.name}: ${p.stock}</div>`).join('')||'<div class="mu">None</div>'}</div><div class="mu">Note: total sales ≠ net profit. Product cost and expenses are not tracked.</div><button class="b o" style="margin-top:8px" onclick="csv()">${ic('download')} Download sales report (CSV)</button>`}
if(T=='prod')return tabs+`<button class="b" style="width:100%" onclick="pform()">+ Add product</button>`+mine.map(p=>`<div class="card"><div class="row sp"><b>${EM[p.cat]} ${p.name}</b><span class="tag ${p.st=='published'?'':'w'}">${p.st}</span></div><div class="mu">${m(pr(p))}/${p.unit} · stock ${p.stock}</div><div class="row" style="margin-top:6px"><button class="b o s" onclick="pform(${p.id})">Edit</button><button class="b o s" onclick="qs(${p.id})">Stock</button><button class="b o s" onclick="tog(${p.id})">${p.st=='published'?'Unpublish':'Publish'}</button><button class="b r s" onclick="delP(${p.id})">Delete</button></div></div>`).join('');
if(T=='ord')return tabs+(os.map(o=>{const i=FLOW.indexOf(o.status),nx=FLOW[i+1];return `<div class="card"><div class="row sp"><b>#${o.id} · ${U(o.bid).name}</b><span class="tag">${o.status}</span></div><div class="mu">${o.method=='delivery'?ic('pin')+' '+o.addr:'Pickup'} · ${o.pay}${o.note?' · '+ic('note')+' '+o.note:''}</div>${o.items.map(x=>`<div>${x.q} ${x.unit} ${x.name}</div>`).join('')}<b>${m(o.total)}</b><div class="row" style="margin-top:6px">${o.status=='Pending'?`<button class="b s" onclick="setSt(${o.id},'Accepted')">Accept</button><button class="b r s" onclick="setSt(${o.id},'Rejected')">Reject</button>`:nx&&i>0?`<button class="b s" onclick="setSt(${o.id},'${nx}')">${nx=='Ready'?(o.method=='pickup'?'Ready for pickup':'Shipped'):nx}</button>`:''}<button class="b o s" onclick="receipt(${o.id})">Print</button>${o.method=='delivery'&&['Preparing','Ready'].includes(o.status)?`<button class="b ac s" onclick="shareLoc(${o.id})">${ic('nav')} ${o.loc?'Restart':'Share'} live location</button>`:''}${o.status=='Pending'||/Rej|Canc/.test(o.status)?'':`<button class="b o s" onclick="go(\'track\',${o.id})">${ic('pin')} Track</button>`}<button class="b o s" onclick="chatWith(${o.bid},0,${o.id})">${ic('chat')} Buyer</button></div></div>`}).join('')||'<div class="card">No orders yet.</div>');
return tabs+`<div class="card"><b>Store settings</b><input id="sn" value="${s.store}"><textarea id="sd">${s.desc}</textarea><select id="sa">${lopt(s.area)}</select><select id="so"><option value="1" ${s.open?'selected':''}>Open</option><option value="0" ${s.open?'':'selected'}>Temporarily closed</option></select><button class="b" onclick="saveStore()">Save</button></div><div class="mu">Plan: ${s.plan} · Rating ${avg(s.ratings)}</div>`}
function saveStore(){const s=me().seller;s.store=$('#sn').value;s.desc=$('#sd').value;s.area=$('#sa').value;s.open=+$('#so').value;save();toast('Saved')}
let TI='';function pimg(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);TI=c.toDataURL('image/jpeg',.7);toast('Photo ready (compressed)')};im.src=r.result};r.readAsDataURL(f)}
function pform(id){const p=id?P(id):{name:'',cat:CATS[0],price:'',disc:'',stock:'',unit:'kg',desc:'',st:'published'};
TI=p.img||'';openS(`<h3>${id?'Edit':'Add'} product</h3><input id="f1" placeholder="Name" value="${p.name}"><select id="f2">${CATS.map(c=>`<option ${c==p.cat?'selected':''}>${c}</option>`).join('')}</select><div class="row"><input id="f3" type="number" placeholder="Price" value="${p.price}" style="flex:1"><input id="f4" type="number" placeholder="Discount price" value="${p.disc||''}" style="flex:1"></div><div class="row"><input id="f5" type="number" placeholder="Stock" value="${p.stock}" style="flex:1"><select id="f6" style="flex:1">${['kg','gram','piece','pack','sack','bundle'].map(c=>`<option ${c==p.unit?'selected':''}>${c}</option>`).join('')}</select></div><div class="mu">${ic('camera')} Product photo (camera or gallery)</div><input type="file" accept="image/*" capture="environment" onchange="pimg(this)"><textarea id="f7" placeholder="Description">${p.desc}</textarea><select id="f8"><option value="published" ${p.st=='published'?'selected':''}>Publish</option><option value="draft" ${p.st=='draft'?'selected':''}>Save as draft</option></select><button class="b" style="width:100%" onclick="psave(${id||0})">Save</button>`)}
function psave(id){const v=i=>$('#f'+i).value,d={name:v(1).trim(),cat:v(2),price:+v(3),disc:+v(4)||0,stock:+v(5),unit:v(6),desc:v(7),st:v(8),img:TI};if(!d.name||d.price<=0||d.stock<0||(d.disc&&d.disc>=d.price))return toast('Check name, price, discount, stock');
if(id)Object.assign(P(id),d);else D.products.push({id:Date.now()%1e9,sid:D.me,sold:0,...d});save();closeS();render()}
function qs(id){const v=prompt('New stock quantity',P(id).stock);if(v!==null&&+v>=0){P(id).stock=+v;save();render()}}
function tog(id){const p=P(id);p.st=p.st=='published'?'draft':'published';save();render()}
function delP(id){if(confirm('Delete product?')){D.products=D.products.filter(p=>p.id!=id);save();render()}}
function csv(){const r=['Order,Date,Buyer,Subtotal,Commission,Net'];D.orders.filter(o=>o.sid==D.me&&o.status=='Completed').forEach(o=>r.push([o.id,'"'+o.date+'"','"'+U(o.bid).name+'"',o.sub,o.comm,(o.sub-o.comm).toFixed(2)].join(',')));
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.join('\n'));a.download='sales.csv';a.click()}
/* ---------- Admin ---------- */
function admin(){const u=me();if(!u||u.role!='admin')return auth();const T=TAB||'sum',sl=D.users.filter(x=>x.seller),done=D.orders.filter(o=>o.status=='Completed');
const tabs=`<div class="tabs">${[['sum','Dashboard'],['sel','Sellers'],['prod','Products'],['usr','Users'],['tix','Tickets'],['set','Settings']].map(t=>`<span class="chip ${T==t[0]?'on':''}" onclick="go('admin','${t[0]}')">${t[1]}</span>`).join('')}</div>`;
if(T=='sum')return tabs+`<div class="stat"><div><b>${D.users.length}</b>Users</div><div><b>${sl.length}</b>Sellers</div><div><b>${D.products.length}</b>Products</div><div><b>${D.orders.length}</b>Orders</div><div><b>${m(done.reduce((a,o)=>a+o.sub,0))}</b>Sales volume</div><div><b>${m(done.reduce((a,o)=>a+o.comm,0))}</b>Platform earnings</div></div><div class="card"><b>Orders monitor</b>${D.orders.slice(0,6).map(o=>`<div class="row sp mu"><span>#${o.id} ${U(o.sid).seller.store}</span><span>${o.status} · ${m(o.total)}</span></div>`).join('')||'<div class="mu">None</div>'}</div><div class="card"><b>Alerts & audit</b>${D.notes.filter(n=>n.uid==1).slice(0,8).map(n=>`<div class="mu">• ${n.t}</div>`).join('')}</div>`;
if(T=='sel')return tabs+sl.map(s=>`<div class="card"><div class="row sp"><b>${s.seller.store}</b><span class="tag ${s.seller.status=='approved'?'':'w'}">${s.seller.status}</span></div><div class="mu">${s.name} · ${s.seller.area}</div><div class="row" style="margin-top:6px"><button class="b s" onclick="sv(${s.id},'approved')">Approve</button><button class="b r s" onclick="sv(${s.id},'rejected')">Reject</button></div></div>`).join('');
if(T=='prod')return tabs+D.products.map(p=>`<div class="card row sp"><div><b>${p.name}</b><div class="mu">${U(p.sid).seller.store} · ${p.st}</div></div><div class="row"><button class="b o s" onclick="mod(${p.id},'${p.st=='hidden'?'published':'hidden'}')">${p.st=='hidden'?'Approve':'Hide'}</button><button class="b r s" onclick="rmP(${p.id})">Remove</button></div></div>`).join('');
if(T=='usr')return tabs+D.users.filter(x=>x.role!='admin').map(x=>`<div class="card row sp"><div><b>${x.name}</b><div class="mu">${x.email}</div></div><div class="row" style="flex-wrap:nowrap"><button class="b o s" onclick="rpw(${x.id})">Reset password</button><button class="b ${x.active?'r':''} s" onclick="susp(${x.id})">${x.active?'Suspend':'Activate'}</button></div></div>`).join('');
if(T=='tix')return tabs+((D.tickets||[]).map(t=>`<div class="card"><div class="row sp"><b>#${t.id} · ${esc(t.topic)}</b><span class="tag ${t.status=='Open'?'w':''}">${t.status}</span></div><div class="mu">${esc((U(t.uid)||{}).name||'')}${t.oid?' · Order #'+t.oid:''}</div><div>${esc(t.msg)}</div>${t.reply?`<div class="mu">Reply: ${esc(t.reply)}</div>`:''}<div class="row" style="margin-top:6px"><button class="b s" onclick="tReply(${t.id})">Reply & resolve</button></div></div>`).join('')||'<div class="card mu">No tickets.</div>');
return tabs+`<div class="card"><b>Commission rate (%)</b><input id="cm" type="number" value="${D.commission}"><button class="b" onclick="saveSet({commission:+$('#cm').value})">Save</button></div><div class="card"><b>Map search area</b><div class="mu">Added to Google Maps searches, e.g. Town, Province</div><input id="tw" value="${esc(D.town||'')}" placeholder="Town / city, province"><button class="b" onclick="saveSet({town:$('#tw').value.trim()})">Save</button></div><div class="card"><b>Categories</b><div class="mu">${CATS.join(', ')}</div></div>`}
function log(t){D.notes.unshift({uid:1,t:'[Audit] '+t,d:new Date().toLocaleString()})}
function sv(id,s){U(id).seller.status=s;notify(id,'Seller verification: '+s);log(`Seller ${U(id).seller.store} ${s}`);save();render()}
function mod(id,s){P(id).st=s;notify(P(id).sid,`Product "${P(id).name}" ${s=='hidden'?'hidden by admin':'approved'}`);log('Product '+id+' '+s);save();render()}
function rmP(id){if(confirm('Remove listing?')){log('Removed product '+id);D.products=D.products.filter(p=>p.id!=id);save();render()}}
function susp(id){const u=U(id);u.active=u.active?0:1;log((u.active?'Activated ':'Suspended ')+u.name);save();render()}

/* ---------- server-backed actions (override the local versions above) ---------- */
function notify(){}
let MR=null;
function markRead(id){if(!D.me||!D.msgs.some(m=>m.f==id&&m.t==D.me&&m.ts>rd(D.me,id)))return;D.rt[D.me+'-'+id]=Date.now();clearTimeout(MR);MR=setTimeout(()=>api('PUT','/me',{rt:D.rt},true).catch(()=>{}),300)}
async function login(){try{const r=await api('POST','/login',{email:$('#e').value.trim(),pw:$('#p').value});setTok(r.token);await refresh(true);toast('Welcome '+me().name);go('home')}catch(e){}}
async function reg(){try{const sl=$('#sl').checked,r=await api('POST','/register',{name:$('#n').value,email:$('#e').value,pw:$('#p').value,seller:sl?{store:$('#st').value,area:$('#ar').value}:null});setTok(r.token);await refresh(true);toast('Account created');go('me')}catch(e){}}
async function logout(){setTok('');D.cart=[];save();try{await refresh(true)}catch(e){}go('auth')}
function forgot(){openS('<h3>Forgot password?</h3><p class="mu">Contact the LokalMart admin for a temporary password, then change it in your profile.</p>')}
async function saveProf(){const a=$('#pa').value.trim(),pw=$('#pw').value;await act('PUT','/me',{name:$('#pn').value,pw:pw.length?pw:undefined,addrs:a?[...me().addrs,a]:undefined},'Saved')}
async function deact(){if(confirm('Deactivate your account?')){try{await api('POST','/me/deactivate');await logout()}catch(e){}}}
async function adAdd(){const v=$('#as2').value.trim();if(!v)return toast('Enter street / purok');await act('PUT','/me',{addrs:[...me().addrs,v+', '+$('#ab').value]},'Address saved')}
async function adDel(i){const a=[...me().addrs];a.splice(i,1);CK.addr='';await act('PUT','/me',{addrs:a})}
async function adDef(i){const a=[...me().addrs],x=a.splice(i,1)[0];a.unshift(x);CK.addr='';await act('PUT','/me',{addrs:a})}
async function addAddr(){const v=$('#na').value.trim();if(!v)return toast('Enter street / purok');const a=v+', '+$('#nb').value;CK.addr=a;await act('PUT','/me',{addrs:[...me().addrs,a]})}
async function fav(id,d){if(!me())return go('auth');const f=[...D.fav],i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);D.fav=f;await act('PUT','/me',{fav:f});if(d)detail(id)}
async function followS(id){const u=me();if(!u)return go('auth');const f=[...(u.fs||[])],i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);await act('PUT','/me',{fs:f})}
async function doApply(){const s=$('#as').value.trim();if(!s)return toast('Enter a store name');if(await act('POST','/seller',{store:s,area:$('#aa').value},'Application submitted'))closeS()}
async function saveStore(){await act('PUT','/seller',{store:$('#sn').value,desc:$('#sd').value,area:$('#sa').value,open:+$('#so').value},'Saved')}
async function psave(id){const v=i=>$('#f'+i).value,d={name:v(1).trim(),cat:v(2),price:+v(3),disc:+v(4)||0,stock:+v(5),unit:v(6),desc:v(7),st:v(8),img:TI};if(!d.name||d.price<=0||d.stock<0||(d.disc&&d.disc>=d.price))return toast('Check name, price, discount, stock');if(await act(id?'PUT':'POST',id?'/products/'+id:'/products',d))closeS()}
async function qs(id){const v=prompt('New stock quantity',P(id).stock);if(v!==null&&+v>=0)await act('PUT','/products/'+id,{stock:+v})}
async function tog(id){await act('PUT','/products/'+id,{st:P(id).st=='published'?'draft':'published'})}
async function delP(id){if(confirm('Delete product?'))await act('DELETE','/products/'+id)}
async function place(){const u=me();if(CK.method=='delivery'&&!(CK.addr||u.addrs[0]))return toast('Add a delivery address');
try{await api('POST','/orders',{items:D.cart.map(c=>({pid:c.pid,q:c.q})),method:CK.method,addr:CK.addr||u.addrs[0]||'',note:CK.note,when:CK.when,vc:CK.vc});D.cart=[];CK.note='';CK.vc='';save();await refresh(true);toast('Order placed!');go('orders')}catch(e){try{await refresh()}catch(x){}}}
async function setSt(id,s){if(WID!=null&&['Completed','Rejected','Cancelled'].includes(s)){navigator.geolocation.clearWatch(WID);WID=null}await act('PUT','/orders/'+id+'/status',{status:s})}
async function doRate(id){if(await act('POST','/orders/'+id+'/rate',{r:+$('#rt').value,t:$('#rv').value}))closeS()}
async function delOK(id){await act('POST','/orders/hide',{id});closeS();toast('Deleted')}
function shareLoc(id){if(!navigator.geolocation)return toast('Location is not supported on this device');toast('Requesting location...');if(WID!=null)navigator.geolocation.clearWatch(WID);WT=0;
WID=navigator.geolocation.watchPosition(async p=>{if(WT&&Date.now()-WT<15000)return;const first=!WT;WT=Date.now();try{await api('PUT','/orders/'+id+'/loc',{lat:p.coords.latitude,lng:p.coords.longitude});await refresh(!first);if(first)toast('Live location is on')}catch(e){}},()=>toast('Location blocked. Allow location access in your browser settings.'),{enableHighAccuracy:true,timeout:15000})}
async function refund(id){const t=prompt('Describe the problem / refund request');if(!t)return;await act('POST','/tickets',{topic:'Payment or refund',oid:id,msg:t},'Ticket sent to support')}
async function report(id){if(!D.me)return toast('Login first');await act('POST','/tickets',{topic:'Seller or listing',msg:'Listing #'+id+' reported'},'Report sent to admin')}
async function send(){const i=$('#ci'),t=i.value.trim();if(!t)return;try{await api('POST','/messages',{to:+TAB,x:t});await refresh(true)}catch(e){return}render();const n=$('#ci');n&&n.focus()}
async function clearN(){await act('DELETE','/notes');toast('Notifications cleared');bellS()}
async function sendT(){const x=$('#tm').value.trim();if(!x)return toast('Describe the problem');await act('POST','/tickets',{topic:$('#tt').value,oid:+$('#to').value,msg:x},'Ticket sent')}
async function tDone(id){if(await act('PUT','/tickets/'+id,{reply:$('#tr').value.trim()}))closeS()}
function sv(id,s){return act('PUT','/admin/sellers/'+id,{status:s})}
function mod(id,s){return act('PUT','/admin/products/'+id,{st:s})}
function rmP(id){if(confirm('Remove listing?'))return act('DELETE','/admin/products/'+id)}
function susp(id){return act('PUT','/admin/users/'+id,{active:U(id).active?0:1})}
function saveSet(o){return act('PUT','/admin/settings',o,'Saved')}
function rpw(id){openS(`<h3>Reset password</h3><p class="mu">Set a temporary password for ${esc(U(id).name)} (min 6 characters). Ask them to change it after logging in.</p><input id="tp" placeholder="Temporary password"><button class="b" style="width:100%" onclick="rpwOK(${id})">Save</button>`)}
async function rpwOK(id){if(await act('PUT','/admin/users/'+id,{pw:$('#tp').value},'Password reset'))closeS()}
setInterval(poll,10000);document.addEventListener('visibilitychange',poll);
applyTh();render();$('#app').innerHTML='<div class="empty mu">Loading...</div>';
refresh(true).catch(()=>{}).then(render);

</script></body></html>
